<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mintlify</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:slnt,wght@0,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="landing-wrapper">
      <nav class="nav-bar">
        <div class="nav-container">
          <div class="nav-logo">
            <img width="110px" src="./assets/mintlify-wordmark 1.svg" />
          </div>

          <div class="nav-links">
            <ul>
              <li>Resources</li>
              <li>Documentation</li>
              <li>Customers</li>
              <li>Pricing</li>
              <li>Blogs</li>
            </ul>
          </div>

          <div class="nav-cta">
            <button class="contact-sales-cta">Contact sales</button>
            <button class="start-for-free">Start for free</button>
          </div>
        </div>
      </nav>

      <div class="body-container">
        <div class="badge">
          <div class="badge-container">
            <p class="badge-text">
              <span class="new">NEW</span>
              Self-updating docs with agent suggestions
            </p>
          </div>
        </div>

        <div class="hero-content">
          <div class="hero-content-container">
            <p class="hero-title">
              The Intelligent <br />
              Knowledge Platform
            </p>
            <p class="hero-sub-title">
              Helping teams create and maintain world-class <br />
              documentation built for both humans and AI
            </p>

            <div class="input-container">
              <div class="input">
                <input placeholder="Email address" />
                <button class="input-btn">Start now</button>
              </div>
            </div>
          </div>
        </div>

        <div class="hero-img-container">
          <img class="hero-img" src="./assets/hero-image-dark.svg" />
        </div>
      </div>
    </div>

    <section class="client-logo-container">
      <div class="client-logos">
        <div class="logo logo1">
          <img src="./assets/logos/Img - Anthropic → SVG.svg" />
        </div>

        <div class="logo">
          <img src="./assets/logos/Img - Coinbase → SVG.svg" />
        </div>

        <div class="logo">
          <img src="./assets/logos/Img - Microsoft → SVG.svg" />
        </div>

        <div class="logo">
          <img src="./assets/logos/Img - Perplexity → SVG.svg" />
        </div>

        <div class="logo">
          <img src="./assets/logos/Img - Hubspot → SVG.svg" />
        </div>

        <div class="logo">
          <img src="./assets/logos/Img - X → SVG.svg" />
        </div>

        <div class="logo">
          <img src="./assets/logos/Img - PayPal → SVG.svg" />
        </div>

        <div class="logo">
          <img src="./assets/logos/Img - Lovable → SVG.svg" />
        </div>
      </div>
    </section>
  </body>
</html>
